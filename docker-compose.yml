# ==============================================
# BOOKSNAP - Docker Compose Configuration
# ==============================================
# Services : PostgreSQL, Backend (Spring Boot), Frontend (Lit + Nginx)
# Usage : docker compose up --build
# ==============================================

services:
  # ======================
  # DATABASE (PostgreSQL)
  # ======================
  db:
    container_name: booksnap-postgres
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '${DB_PORT:-5432}:5432'

    volumes:
      # Data persistence
      - db-data:/var/lib/postgresql/data

      # NO auto-init SQL. The schema and the Dewey reference data are owned by
      # Flyway (server/src/main/resources/db/migration), applied when the
      # backend starts. Mounting sql/ into /docker-entrypoint-initdb.d/ here
      # would build a second, unversioned schema on a fresh volume — and it
      # would run *before* the backend exists, so seed.sql would hit tables
      # that have not been created yet.
      #
      # Development fixtures are loaded by hand, once the backend has started
      # at least once against the fresh volume:
      #   docker exec -i booksnap-postgres sh -c \
      #     'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < server/sql/seed.sql
      #   docker exec -i booksnap-postgres sh -c \
      #     'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < server/sql/covers.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - booksnap-network

  # ======================
  # PGADMIN (optional - DB interface)
  # ======================
  pgadmin:
    container_name: booksnap-pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    ports:
      - '${PGADMIN_PORT:-5050}:80'

    depends_on:
      db:
        condition: service_healthy

    networks:
      - booksnap-network

  # ======================
  # BACKEND (Spring Boot)
  # ======================
  backend:
    container_name: booksnap-backend
    build:
      context: ./server
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      # Database connection (uses the Docker service name)
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Spring profiles
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # Session cookie Secure flag, off by default since this stack serves plain HTTP
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

      # Browser origins allowed to call the API. Needed here because this stack serves
      # the front end on :3000 and the API on :8080 — two origins, so CORS applies.
      # A deployment putting both behind one domain can set it empty.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # First administrator, created at startup only while no admin account exists.
      # Listed here because the image carries no .env of its own: spring-dotenv reads
      # the file next to the project, which is not in the container. Left empty by
      # default, and to be emptied again once the account is created.
      BOOKSNAP_BOOTSTRAP_ADMIN_EMAIL: ${BOOKSNAP_BOOTSTRAP_ADMIN_EMAIL:-}
      BOOKSNAP_BOOTSTRAP_ADMIN_PASSWORD: ${BOOKSNAP_BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOKSNAP_BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOKSNAP_BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOKSNAP_BOOTSTRAP_ADMIN_LAST_NAME: ${BOOKSNAP_BOOTSTRAP_ADMIN_LAST_NAME:-}

    ports:
      - '${BACKEND_PORT:-8080}:8080'

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - booksnap-network

  # ======================
  # FRONTEND (Lit + Nginx)
  # ======================
  frontend:
    container_name: booksnap-frontend
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Backend API URL (accessible from the browser, not from the container)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}

    restart: unless-stopped

    ports:
      - '${FRONTEND_PORT:-3000}:80'

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - booksnap-network

# ======================
# NETWORKS
# ======================
networks:
  booksnap-network:
    driver: bridge
    name: booksnap-network

# ======================
# VOLUMES
# ======================
volumes:
  db-data:
    driver: local
    name: booksnap-db-data
