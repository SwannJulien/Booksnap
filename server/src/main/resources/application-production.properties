# Replit Publish owns the production PostgreSQL schema diff.
# Do not run Flyway DDL against the managed production database at startup.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?stringtype=unspecified
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# Frontend and API share the VM, with Vite preview proxying API requests.
booksnap.cors.allowed-origins=
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
