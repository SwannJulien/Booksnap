spring.application.name=booksnap-backend

# PostgreSQL Configuration
# stringtype=unspecified: without it, the driver sends setString() parameters typed
# `varchar`, and PostgreSQL then resolves `citext = varchar` as a `text` comparison —
# case-sensitive. Even though users.email has been on the `email` domain (citext) since
# V4, lookup by email would become case-sensitive again. With `unspecified`, the
# parameter is sent untyped and the server infers citext. Verified: varchar -> 0 rows,
# inferred -> 1 row.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}?stringtype=unspecified
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# HikariCP Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Configuration
# Flyway is the ONLY authority on the schema. Migrations live in
# src/main/resources/db/migration, named V<n>__<description>.sql.
spring.flyway.enabled=true
# The live database already exists and holds V1 (schema) and V2 (Dewey):
# baseline-version=2 marks them as applied and keeps them from being replayed there.
# Flyway skips every migration whose version is <= baseline-version.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# JPA Configuration
# `validate`, not `update`: Hibernate checks that the entities match the schema,
# without ever changing it outside of versioned migrations.
# If validation blocks startup, switch temporarily to `none` — never `update`, which
# would put Hibernate back to changing the schema behind Flyway's back.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Pagination Configuration
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.page-serialization-mode=VIA_DTO

# Slf4j Configuration
logging.level.root=INFO
logging.level.net.booksnap=DEBUG

# Cover Configuration
# Covers are stored as bytea in the `cover` table; this caps what a single upload may write.
booksnap.cover.max-size-bytes=2097152

# BCrypt Configuration
# Cost factor used to hash and verify passwords: each increment doubles the work.
# That cost is the protection against offline cracking of a stolen hash, so it is
# tunable per environment but never lowered to make logins or tests feel faster.
# 10 is around 100 ms per attempt; the encoder rejects anything outside [4, 31].
booksnap.security.bcrypt-strength=10

# API Lockdown Configuration
# Emergency switch back to a fully open API, added with US-009. `false` replaces the
# whole permission matrix with permitAll() — every endpoint public again, the user
# directory included — and logs a WARN at every startup saying so.
#
# It exists for one situation: a release that locks the school out of its own library
# (no sign-in screen shipped alongside, an unusable bootstrap administrator), where the
# alternative is rolling back the whole thing. It is a same-day measure, not a setting.
# Never commit it as `false`; drive it from the environment if it is ever needed.
booksnap.security.lockdown-enabled=${SECURITY_LOCKDOWN_ENABLED:true}

# Admin Bootstrap Configuration
# The first `admin` account, created at startup ONLY when no account holds that role
# — otherwise locking the API down would leave nobody able to sign in and create one.
# See AdminBootstrapRunner and server/README.md.
#
# Read from the environment (spring-dotenv picks up the repository's .env), never
# written here: this file is versioned, and the password would be committed with it.
# Leaving them empty is the normal state of an installed instance — the runner only
# warns, and only while no administrator exists. Clear them once the account is created.
booksnap.bootstrap.admin.email=${BOOKSNAP_BOOTSTRAP_ADMIN_EMAIL:}
booksnap.bootstrap.admin.password=${BOOKSNAP_BOOTSTRAP_ADMIN_PASSWORD:}
booksnap.bootstrap.admin.first-name=${BOOKSNAP_BOOTSTRAP_ADMIN_FIRST_NAME:}
booksnap.bootstrap.admin.last-name=${BOOKSNAP_BOOTSTRAP_ADMIN_LAST_NAME:}

# CORS Configuration
# Origins allowed to call the API from a browser, comma-separated.
# `localhost:3000` stays the default because the Docker stack serves the front end on
# that port and the API on 8080: two origins, hence CORS.
# In development with `npm run dev`, the Vite proxy makes everything same-origin and
# this list is unused — keeping it costs nothing.
# `localhost:8000` was removed: no service of the project listens there.
# An empty value disables CORS, which is the right answer when front end and API are
# served behind the same domain.
# Reminder: `*` is impossible here, allowCredentials(true) forbids it.
booksnap.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Session Configuration
# Sessions live in Tomcat's memory: they are lost on every restart, and they would
# not be shared if a second instance were ever deployed (that would call for
# spring-session-jdbc). Acceptable while a single instance serves the school.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Driven by the environment on purpose: hard-coded to true it breaks plain-HTTP
# development, hard-coded to false it ships to production.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Idle timeout, not an absolute lifetime: a day at the desk without having to log
# back in mid-afternoon.
server.servlet.session.timeout=8h
