# Development profile for the fresh Replit PostgreSQL database.
# Credentials are supplied by the runtime, never stored in this file.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?stringtype=unspecified
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# A fresh database must run every migration, not baseline an existing schema.
spring.flyway.baseline-on-migrate=false

# Vite proxies the API on the same origin as the frontend.
booksnap.cors.allowed-origins=
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
